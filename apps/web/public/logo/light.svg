<svg width="200px" height="60px" viewBox="0 0 200 60" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Fora Logo - Light Mode</title>
    <defs>
        <!-- تدرج لوني أغمق يناسب الخلفيات الفاتحة -->
        <linearGradient x1="0%" y1="50%" x2="100%" y2="50%" id="textGradientLight">
            <stop stop-color="#311B92" offset="0%"></stop> <!-- بنفسجي غامق جداً -->
            <stop stop-color="#C2185B" offset="100%"></stop> <!-- وردي غامق -->
        </linearGradient>
    </defs>
    
    <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="Fora-Logo" transform="translate(10.000000, 10.000000)">
            <!-- النص -->
            <text id="Fora" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradientLight)">
                <tspan x="0" y="44">Fora</tspan>
            </text>
            
            <!-- رمز النجم/البوصلة بلون أغمق للوضوح -->
            <g id="Star-Icon" transform="translate(120.000000, 0.000000)" fill="#37474F">
                <path d="M28,0 L31.5,21 L52,24.5 L31.5,28 L28,49 L24.5,28 L4,24.5 L24.5,21 Z" id="Star-Shape"></path>
            </g>
        </g>
    </g>
</svg>
