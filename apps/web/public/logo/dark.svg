<svg width="200px" height="60px" viewBox="0 0 200 60" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Fora Logo</title>
    <defs>
        <!-- تعريف التدرج اللوني للنص -->
        <linearGradient x1="0%" y1="50%" x2="100%" y2="50%" id="textGradient">
            <stop stop-color="#5E35B1" offset="0%"></stop> <!-- بنفسجي غامق -->
            <stop stop-color="#E91E63" offset="100%"></stop> <!-- وردي/أحمر -->
        </linearGradient>
    </defs>
    
    <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="Fora-Logo" transform="translate(10.000000, 10.000000)">
            <!-- النص -->
            <text id="Fora" font-family="Arial, sans-serif" font-size="48" font-weight="normal" fill="url(#textGradient)">
                <tspan x="0" y="44">Fora</tspan>
            </text>
            
            <!-- رمز النجم/البوصلة -->
            <g id="Star-Icon" transform="translate(120.000000, 0.000000)" fill="#B0BEC5">
                <path d="M28,0 L31.5,21 L52,24.5 L31.5,28 L28,49 L24.5,28 L4,24.5 L24.5,21 Z" id="Star-Shape"></path>
            </g>
        </g>
    </g>
</svg>
